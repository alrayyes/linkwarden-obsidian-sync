# The same commands CI runs, so the two cannot drift. The hook catches it
# early; CI is the gate that cannot be skipped.
#
# Every Go command runs through Docker rather than the host toolchain, pinned
# to the `go` directive in go.mod: a host package manager updating `go` and
# `golangci-lint` independently is a real failure mode, not a hypothetical
# one. See rules/go.md and rules/go-lint.md for why.

# pre-commit may write. Let the fixer run and restage what it touched — a
# commit should not fail over a formatting nit a tool can settle by itself.
pre-commit:
  jobs:
    - name: gofmt
      glob: "*.go"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm gofmt -w {staged_files}
      stage_fixed: true

    - name: hadolint
      glob: "Dockerfile"
      run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

    - name: goreleaser-check
      glob: ".goreleaser.{yml,yaml}"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        goreleaser/goreleaser:v2.17.1 check

    # Scoped to what the Dockerfile's COPY actually pulls in, so an
    # unrelated commit skips this and stays fast; a Go or Dockerfile
    # change pays for a warm-cache image build to prove it still builds —
    # hadolint above reads the Dockerfile as text and never checks that.
    - name: docker-build
      glob: "{Dockerfile,**/*.go,go.mod,go.sum}"
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=amd64
        golang:1.27.0-bookworm go build -o linkwarden-obsidian-sync ./cmd/linkwarden-obsidian-sync
        && docker build -t linkwarden-obsidian-sync:pre-commit-check .
        && rm -f linkwarden-obsidian-sync
        && docker rmi linkwarden-obsidian-sync:pre-commit-check

commit-msg:
  jobs:
    # Resolved from node_modules rather than fetched by bunx: commitlint has
    # to load the config its own config extends, and bunx cannot resolve a
    # sibling package for it. Run `bun install` if this cannot find itself.
    - name: commitlint
      run: bunx commitlint --edit {1}

# pre-push never writes. A hook rewriting files under a push leaves the
# pushed commit and the working tree disagreeing about what was reviewed.
#
# Parallel because of that: nothing here touches a file, so no job can be
# reading what another is rewriting.
pre-push:
  parallel: true
  jobs:
    - name: golangci-lint
      # Pinned to the same v2.13.0 ci.yml's golangci-lint-action uses, so the
      # hook and CI can't drift.
      #
      # Not rules/go-lint.md's own v2.12.2 example: v2.12.2 is built with
      # go1.26, which refuses to load config against this repo's go 1.27.0
      # directive ("the Go language version used to build golangci-lint is
      # lower than the targeted Go version") — confirmed live, the exact
      # failure mode that rule's own reasoning warns about. v2.13.0 is built
      # with go1.27.0.
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOLANGCI_LINT_CACHE=/cache -v "$HOME/.cache/golangci-lint-docker:/cache"
        golangci/golangci-lint:v2.13.0 golangci-lint run ./...

    - name: test
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        golang:1.27.0-bookworm go test ./... -race

    - name: hadolint
      run: docker run --rm -i hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d < Dockerfile

    - name: goreleaser-check
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        goreleaser/goreleaser:v2.17.1 check

    - name: docker-build
      run: >-
        docker run --rm --user "$(id -u):$(id -g)"
        -v "$(pwd):/src" -w /src
        -e GOCACHE=/gocache -v "$HOME/.cache/go-build-docker:/gocache"
        -e GOMODCACHE=/gomod -v "$HOME/.cache/go-mod-docker:/gomod"
        -e CGO_ENABLED=0 -e GOOS=linux -e GOARCH=amd64
        golang:1.27.0-bookworm go build -o linkwarden-obsidian-sync ./cmd/linkwarden-obsidian-sync
        && docker build -t linkwarden-obsidian-sync:pre-push-check .
        && rm -f linkwarden-obsidian-sync
        && docker rmi linkwarden-obsidian-sync:pre-push-check
