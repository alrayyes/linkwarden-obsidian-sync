version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: .
    binary: linkwarden-obsidian-sync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

changelog:
  disable: true

release:
  mode: keep-existing
