version: 2

before:
  hooks:
    - go mod tidy
    - go run -tags mangen ./cmd/linkwarden-obsidian-sync man
    # nfpm doesn't compress man pages itself, unlike makepkg's own tidy
    # step for the AUR package below — Debian policy expects them gzipped.
    - sh -c "gzip -kf man/*.1"

builds:
  - main: ./cmd/linkwarden-obsidian-sync
    binary: linkwarden-obsidian-sync
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Os }}_{{ .Arch }}

dockers:
  - image_templates:
      - "ghcr.io/alrayyes/linkwarden-obsidian-sync:{{ .Version }}-amd64"
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
      - --platform=linux/amd64
  - image_templates:
      - "ghcr.io/alrayyes/linkwarden-obsidian-sync:{{ .Version }}-arm64"
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
      - --platform=linux/arm64

docker_manifests:
  - name_template: "ghcr.io/alrayyes/linkwarden-obsidian-sync:{{ .Version }}"
    image_templates:
      - "ghcr.io/alrayyes/linkwarden-obsidian-sync:{{ .Version }}-amd64"
      - "ghcr.io/alrayyes/linkwarden-obsidian-sync:{{ .Version }}-arm64"
  - name_template: "ghcr.io/alrayyes/linkwarden-obsidian-sync:latest"
    image_templates:
      - "ghcr.io/alrayyes/linkwarden-obsidian-sync:{{ .Version }}-amd64"
      - "ghcr.io/alrayyes/linkwarden-obsidian-sync:{{ .Version }}-arm64"

# deb/rpm only: nfpm's package formats are Linux-only, so goreleaser skips
# the darwin build from `builds` above on its own — nothing to exclude here.
nfpms:
  - package_name: linkwarden-obsidian-sync
    formats:
      - deb
      - rpm
    maintainer: Ryan Kes <ryan@andthensome.nl>
    description: >-
      Keeps a directory of Obsidian notes in sync with your saved
      Linkwarden links.
    homepage: https://github.com/alrayyes/linkwarden-obsidian-sync
    license: GPL-3.0-only
    bindir: /usr/bin
    contents:
      - src: man/linkwarden-obsidian-sync.1.gz
        dst: /usr/share/man/man1/linkwarden-obsidian-sync.1.gz
      - src: man/linkwarden-obsidian-sync-init.1.gz
        dst: /usr/share/man/man1/linkwarden-obsidian-sync-init.1.gz

changelog:
  disable: true

release:
  mode: keep-existing
