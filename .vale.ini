StylesPath = styles
MinAlertLevel = warning

# Downloaded by `vale sync`, not committed. The style folders they land in are
# gitignored by name; styles/config/ is ours and is not.
#
# write-good is here specifically for passive voice — neither Google nor
# proselint actually checks for it (confirmed live: a deliberately passive
# sentence got zero findings until this was added), and it's what LTeX's
# own PASSIVE_VOICE rule is disabled in favour of.
Packages = Google, proselint, write-good

# Core options first — Vale refuses a Vocab set after a format section.
Vocab = House

[*.md]
BasedOnStyles = Vale, Google, proselint, write-good

# Holds the document to the spellings in the vocabulary — "Github", "NPM" and
# "javascript" get flagged where GitHub, npm and JavaScript are the accepted
# forms. Without it, accept.txt only silences the spell checker and any casing
# passes.
Vale.Terms = YES

# Off on purpose. Docs here are written to a person — "you" — not narrated as
# "we", and the point of that voice is the contractions it reads with.
Google.We = NO
Google.FirstPerson = NO
Google.Contractions = NO

# This repo's headings are a mix of sentence-style prose and stable
# title-case section names ("Nix / NixOS", "Fedora/RHEL (.rpm)") — neither
# is the "title case is wrong" case this rule targets.
Google.Headings = NO

# Spaced em dashes are deliberate house typography — CLAUDE.md's own
# "Writing for a reader" section mandates them — not a mistake to flag
# thirty times until everyone stops reading the tier that found it.
Google.EmDash = NO

# British punctuation: commas and full stops go outside the quotation marks
# unless they belong to the quoted text. Google's guide is American and wants
# them inside — this repo is written in British English, so the rule would be
# asking it to be half one thing and half the other.
Google.Quotes = NO

# Tuned for Google's own web docs, not this repo's content: it wants "tap"
# for "touch" on a line about the Unix `touch` command, and "preceding" for
# every "above" in a linear document that's never going to reflow — six
# findings across five docs, none of them a real improvement.
Google.WordListCase = NO

# Unreliable on this repo's common em-dash-appositive-plus-two-verb
# construction ("X — built and pushed by hand") — two of three findings
# here were false positives on a two-item compound verb, not a list. The
# one genuine three-item list it caught got fixed on its own merits; this
# rule doesn't get to stay on for a 33% hit rate.
Google.OxfordComma = NO

# Fires on a proper noun right after a colon ("four tiers: Prettier
# (layout), markdownlint-cli2 (structure)...") wanting it lowercased —
# which would just misspell the product name. A doc this full of named
# tools hits this constantly.
Google.Colons = NO
