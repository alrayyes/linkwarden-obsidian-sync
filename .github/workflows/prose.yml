# The two tiers markdownlint doesn't cover.
#
# Layout is Prettier and structure is markdownlint, both in ci.yml. Those
# pass a document that reads badly: neither notices "an university", "the
# the", or a paragraph that has quietly gone passive.
#
# Mechanics and style are separate jobs on purpose. When this goes red the
# job name should say which tier failed, because a grammar mistake and a
# style opinion are answered differently — one is wrong, the other is a
# suggestion.
name: prose

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .github/workflows/prose.yml
  pull_request:
    paths:
      - "**/*.md"
      - .vale.ini
      - .ltex.json
      - styles/**
      - .github/workflows/prose.yml

permissions:
  contents: read

concurrency:
  group: prose-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Mechanics: grammar, spelling, the phonetic article. These have a right
  # answer, so this one fails the build.
  mechanics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check the prose this repository owns
        # The same script the pre-push hook runs, so the two cannot
        # disagree about the version, the file list or what counts as a
        # failure.
        run: ./scripts/lint-mechanics.sh

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Vale
        env:
          GOTOOLCHAIN: auto
        run: go install github.com/errata-ai/vale/v3/cmd/vale@v3.19.0

      - name: Vale
        # The same script the pre-push hook runs, so the two cannot check
        # different files or disagree about what's worth failing on.
        env:
          VALE_REPORT: vale.txt
        run: ./scripts/lint-prose.sh

      - name: Report
        if: always()
        run: |
          {
            echo '### Vale'
            echo
            if [ -s vale.txt ]; then
              echo '```'
              cat vale.txt
              echo '```'
            else
              echo 'Nothing to report.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
