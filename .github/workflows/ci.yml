name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push to main must not cancel a deploy half way through.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go build -tags mangen ./...
      - run: go vet ./...
      - run: go vet -tags mangen ./...
      - run: gofmt -l . | (! grep .)
      - run: go mod tidy -diff
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: check
      # gotestsum wraps go test for the JUnit report Test Analytics needs,
      # on top of the same human-readable output go test already gave.
      - run: >-
          go tool gotestsum --junitfile junit.xml --
          ./... -race -coverprofile=coverage.out
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      # The reports job below turns these into the published reports.
      - name: Upload test and coverage output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-raw
          path: |
            junit.xml
            coverage.out
          if-no-files-found: error
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          # A Dependabot PR doesn't get repo secrets by default (GitHub's own
          # restriction, not a misconfiguration here) - CODECOV_TOKEN is empty
          # on that run, and this repo's branch protection makes Codecov
          # refuse a tokenless upload ("Token required because branch is
          # protected"). That's an upload hiccup on an unprivileged run, not
          # a real test regression - true here would fail every Dependabot
          # PR's CI on that basis alone (confirmed live on #85/#86).
          fail_ci_if_error: false
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: junit.xml
          fail_ci_if_error: false

  # bun.lock only pins dev tooling (commitlint, lefthook, prettier,
  # markdownlint), but an advisory in it still runs on every contributor's
  # machine. The bun version comes from package.json's packageManager so CI
  # and the lockfile agree; the advisory database differs between bun
  # versions, so a local run on a newer bun can report more than this does.
  bun-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - run: bun audit

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # A plain `docker build` proves the Dockerfile still builds, which
      # hadolint above never checks — it needs the same prebuilt binary
      # goreleaser's `dockers:` block hands it at release time.
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o linkwarden-obsidian-sync ./cmd/linkwarden-obsidian-sync
      - run: docker build -t linkwarden-obsidian-sync:ci .

  # A goreleaser run finishing is not the same claim as the packages it
  # produced actually installing and running — this proves the latter for
  # every format nfpms/the AUR PKGBUILD build, not just the .tar.gz the
  # other jobs already exercise via a plain `go build`.
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --snapshot --clean --skip=docker,sign,publish,announce
      # ubuntu-latest is Debian-based, so dpkg -i runs natively — a real
      # install, not just extracting the .deb and running what's inside.
      - name: install and run the .deb
        run: |
          set -eu
          sudo dpkg -i dist/*_linux_amd64.deb
          linkwarden-obsidian-sync --help
          zcat /usr/share/man/man1/linkwarden-obsidian-sync.1.gz | grep -q "Keep a directory"
          zcat /usr/share/man/man1/linkwarden-obsidian-sync-init.1.gz | grep -q "Write a template"
      # No native rpm tooling on a Debian-based runner, so this one runs
      # inside Fedora instead.
      - name: install and run the .rpm
        run: |
          docker run --rm -v "$PWD/dist:/dist:ro" fedora:41@sha256:f1a3fab47bcb3c3ddf3135d5ee7ba8b7b25f2e809a47440936212a3a50957f3d sh -c '
            set -eu
            rpm -i /dist/*_linux_amd64.rpm
            linkwarden-obsidian-sync --help
            zcat /usr/share/man/man1/linkwarden-obsidian-sync.1.gz | grep -q "Keep a directory"
          '

  # makepkg refuses to run as root and Arch's own packaging tools only
  # exist in an Arch container, so this is its own job rather than folded
  # into packages above. The PKGBUILD itself stays pointed at the real
  # GitHub release tarball for actual AUR consumers (packaging/aur's own
  # comment in CONTRIBUTING.md); testing it here against a release that
  # doesn't exist yet for this branch would just fail on every PR, so this
  # swaps in a tarball of the current commit and re-points source/
  # sha256sums at it before building — everything else in the PKGBUILD,
  # build() and package() included, runs unmodified.
  aur-package:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    steps:
      - run: pacman -Syu --noconfirm git go namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job's container runs as root, so actions/checkout's own
      # dubious-ownership workaround never reaches this step's later git
      # commands — see rules/tooling.md's "git inside a container-as-root
      # job".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build and verify the AUR package against this commit
        run: |
          set -eu
          useradd -m builder
          workdir=/tmp/aur-ci
          mkdir -p "$workdir"
          pkgver=$(sed -n 's/^pkgver=//p' packaging/aur/PKGBUILD)
          tarball="$workdir/linkwarden-obsidian-sync-$pkgver.tar.gz"
          git archive --prefix="linkwarden-obsidian-sync-$pkgver/" -o "$tarball" HEAD
          sha256=$(sha256sum "$tarball" | cut -d' ' -f1)
          sed \
            -e "s#^source=.*#source=(\"linkwarden-obsidian-sync-$pkgver.tar.gz\")#" \
            -e "s#^sha256sums=.*#sha256sums=('$sha256')#" \
            packaging/aur/PKGBUILD > "$workdir/PKGBUILD"
          chown -R builder "$workdir"
          su builder -c "cd $workdir && makepkg -f"
          namcap "$workdir/PKGBUILD"
          namcap "$workdir"/*.pkg.tar.*

  # flake.nix is the one packaging format that builds from this checkout
  # directly (Nix's own git fetcher reads the flake's source straight
  # from the repo, unlike nfpm/goreleaser building from a Go module or
  # the AUR PKGBUILD pointing at a release tarball), so nix flake check
  # here is a real, unmodified build of the actual PR — no swapped-in
  # tarball needed the way aur-package above needs one.
  nix-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix flake check
      - run: nix build .#default
      - run: ./result/bin/linkwarden-obsidian-sync --help

  # Assembles the published reports on every run, pull requests included, so
  # a broken conversion fails before the merge. Only the Pages artifact upload
  # is limited to a push to main. It needs only `test`: nothing here depends
  # on the packaging jobs, and `deploy` below waits on all of them.
  reports:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reports-raw
          path: raw
      - name: The report layout is what the live check expects
        run: ./scripts/build-reports.test.sh
      - name: Assemble the reports
        run: ./scripts/build-reports.sh site raw/junit.xml raw/coverage.out
      - name: Upload the Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  # Publishes the reports to apis.ryankes.eu/linkwarden-obsidian-sync/reports/.
  # Waits on every other job, so a red run publishes nothing and the reports
  # always describe a green commit.
  deploy:
    runs-on: ubuntu-latest
    needs: [test, docker, packages, aur-package, nix-flake, reports]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # A local check proves the files, not the URL, and the deploy succeeds
      # either way. The retries cover the CDN catching up.
      - name: The live coverage.xml is served and is Cobertura
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --output coverage.xml "${PAGE_URL%/}/reports/coverage/coverage.xml"
          grep -q '<coverage ' coverage.xml
      - name: The live unit.xml is served and is JUnit
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --output unit.xml "${PAGE_URL%/}/reports/tests/unit.xml"
          grep -q '<testsuite' unit.xml
