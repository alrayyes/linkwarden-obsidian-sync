# The scan half of rules/dependencies.md: audit main and keep one open "Dependency advisories"
# issue that lists what's there. Daily for advisories published against pins that haven't moved,
# on a Go or lockfile push so a merged fix closes the ticket at once, and by hand. An audit that
# errors (registry down) fails the job and leaves the ticket alone.
name: advisory-scan

on:
  schedule:
    - cron: "41 5 * * *"
  push:
    branches: [main]
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - package.json
      - bun.lock
      - .github/workflows/advisory-scan.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: advisory-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      # One ticket for both lockfiles: the audit passes only when both are clean. Each tool's
      # output is buffered. If any tool fails without naming an advisory (registry down), the
      # step fails and prints no advisory IDs at all, so another tool's findings can't hide the
      # error and the ticket is left as it is. advisory-scan#8 (multi-command support) will
      # replace this wrapper.
      - uses: alrayyes/advisory-scan@9801551dad16ce63853b2babfda885365d368232 # v0.3.0
        with:
          mode: scan
          command: |
            status=0
            errored=0
            report=
            audit() {
              out=$("$@" 2>&1) && rc=0 || rc=$?
              report="${report}${out}"$'\n'
              [ "${rc}" -eq 0 ] && return 0
              status=1
              printf '%s\n' "${out}" | grep -Eq 'GHSA-|CVE-|GO-[0-9]{4}-[0-9]+' || errored=1
            }
            audit go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
            audit bun audit
            if [ "${errored}" -eq 1 ]; then
              echo "an audit tool failed without naming an advisory; not reporting" >&2
              exit 1
            fi
            printf '%s' "${report}"
            exit "${status}"
          timeout-seconds: 600
          labels: dependencies
