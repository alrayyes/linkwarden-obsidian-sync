name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The default GITHUB_TOKEN can't open the release pull request here:
      # this repo's Settings has "Allow GitHub Actions to create and approve
      # pull requests" off, so release-please-action needs a personal token
      # to push past that (#26). RELEASE_TOKEN is a fine-grained PAT scoped
      # to this repo with Contents: read/write and Pull requests: write.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      # Release pull requests are CLAUDE.md's standing auto-merge
      # exception: merge once every check is green, no separate ask.
      # GitHub's own auto-merge does exactly that — waits for every
      # required status check (branch protection's contexts list, kept in
      # step with ci.yml's actual jobs) and squash-merges the moment
      # they're all green — so there's nothing to poll or gate here beyond
      # enabling it.
      #
      # Read off the action's own prs_created/pr outputs, not a
      # gh pr list --label lookup: that raced release-please-action's own
      # PR creation and lost, confirmed live — the label was on the PR by
      # the time anyone looked, just not yet by the time this step's
      # `gh pr list` query ran a few hundred ms after the PR was created
      # in the same job. The action's outputs carry the PR it just
      # created directly, with no separate query to race.
      - name: enable auto-merge on the release PR
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh pr merge --auto --squash ${{ fromJSON(steps.release.outputs.pr).number }}

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # goreleaser's dockers: block needs both: buildx to build the arm64
      # image cross-arch on this amd64 runner (via QEMU), and a registry
      # login it doesn't do itself.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # actions/attest-build-provenance's subject-path doesn't expand brace
      # patterns (dist/*.{tar.gz,deb,rpm} matched nothing at all, confirmed
      # live on the v2.2.0 release run) — one glob per line instead, which
      # is the documented way to give it more than one pattern.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      # Attest the two per-arch images goreleaser just pushed. Their
      # digests aren't a goreleaser output, so pull them straight off the
      # registry manifest list docker_manifests just wrote.
      - id: digests
        run: |
          version=$(cat dist/metadata.json | jq -r .version)
          image="ghcr.io/${{ github.repository }}"
          echo "amd64=$(docker buildx imagetools inspect "$image:$version-amd64" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
          echo "arm64=$(docker buildx imagetools inspect "$image:$version-arm64" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          push-to-registry: true

  # makepkg refuses to run as root, and packaging/aur/PKGBUILD's committed
  # pkgver is a template, not kept in sync with every release (bumping it
  # would mean this job committing back to main, which CLAUDE.md's release
  # exception explicitly doesn't license beyond the version/CHANGELOG.md
  # commit release-please itself makes) — so this job substitutes the
  # released version and checksum in memory, builds and verifies the
  # result, and pushes only to the separate AUR repo. Nothing here ever
  # touches this repo's own git history.
  aur-publish:
    needs: [release-please, goreleaser]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:68bfc3b0d277b08a99101dc9b94aaa03e5ae70cf1b4fb965c03b2b87b915760d
    steps:
      - run: pacman -Syu --noconfirm git openssh curl go namcap
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # This job's container runs as root, so actions/checkout's own
      # dubious-ownership workaround never reaches this step's later git
      # commands — see rules/tooling.md's "git inside a container-as-root
      # job".
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: build the release PKGBUILD and verify it
        run: |
          set -eu
          version="${{ needs.release-please.outputs.tag_name }}"
          version="${version#v}"
          tarball_url="https://github.com/${{ github.repository }}/archive/${{ needs.release-please.outputs.tag_name }}.tar.gz"
          sha256=$(curl -sL "$tarball_url" | sha256sum | cut -d' ' -f1)
          workdir=/tmp/aur-release
          mkdir -p "$workdir"
          sed \
            -e "s/^pkgver=.*/pkgver=$version/" \
            -e "s/^pkgrel=.*/pkgrel=1/" \
            -e "s/^sha256sums=.*/sha256sums=('$sha256')/" \
            packaging/aur/PKGBUILD > "$workdir/PKGBUILD"
          useradd -m builder
          chown -R builder "$workdir"
          # A real makepkg build against the released tarball, not just a
          # syntax check — packaging/aur's own comment in CONTRIBUTING.md
          # says this gets proven before it's ever pushed to AUR, and this
          # is that proof, every release, not just when someone remembers
          # to check by hand.
          su builder -c "cd $workdir && makepkg --printsrcinfo > .SRCINFO && makepkg -f"
          namcap "$workdir/PKGBUILD"
          namcap "$workdir"/*.pkg.tar.*
      - name: push to the AUR
        env:
          AUR_SSH_KEY: ${{ secrets.AUR_SSH_KEY }}
        run: |
          set -eu
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$AUR_SSH_KEY" > ~/.ssh/aur_ed25519
          chmod 600 ~/.ssh/aur_ed25519
          # Pinned rather than ssh-keyscan'd live: the v2.4.0 run failed
          # "Host key verification failed" with the scanned line silently
          # swallowed by this step's own 2>/dev/null, so there's nothing
          # to point at — could be flaky egress from the runner, could be
          # something about this container's network path, and pinning
          # sidesteps needing to know which. These three are AUR's actual
          # host keys, captured directly against aur.archlinux.org
          # (confirmed live, not copied from memory).
          cat >> ~/.ssh/known_hosts <<'KNOWN_HOSTS'
          aur.archlinux.org ssh-rsa 
          aur.archlinux.org ecdsa-sha2-nistp256 AAAAE2VjZHNhLXNoYTItbmlzdHAyNTYAAAAIbmlzdHAyNTYAAABBBLMiLrP8pVi5BFX2i3vepSUnpedeiewE5XptnUnau+ZoeUOPkpoCgZZuYfpaIQfhhJJI5qgnjJmr4hyJbe/zxow=
          aur.archlinux.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIEuBKrPzbawxA/k2g6NcyV5jmqwJ2s+zpgZGZ7tpLIcN
          KNOWN_HOSTS
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/aur_ed25519 -o IdentitiesOnly=yes"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          aurdir=$(mktemp -d)
          if ! git clone ssh://aur@aur.archlinux.org/linkwarden-obsidian-sync.git "$aurdir"; then
            echo "clone failed — expected on the first-ever publish, since AUR has nothing at this path yet; initializing a fresh repo instead"
            git init "$aurdir"
            git -C "$aurdir" remote add origin ssh://aur@aur.archlinux.org/linkwarden-obsidian-sync.git
          fi
          cp /tmp/aur-release/PKGBUILD /tmp/aur-release/.SRCINFO "$aurdir/"
          cd "$aurdir"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "no AUR changes for this release"
            exit 0
          fi
          git commit -m "release ${{ needs.release-please.outputs.tag_name }}"
          git push origin HEAD:master
