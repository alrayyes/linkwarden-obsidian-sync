name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The default GITHUB_TOKEN can't open the release pull request here:
      # this repo's Settings has "Allow GitHub Actions to create and approve
      # pull requests" off, so release-please-action needs a personal token
      # to push past that (#26). RELEASE_TOKEN is a fine-grained PAT scoped
      # to this repo with Contents: read/write and Pull requests: write.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      # Release pull requests are CLAUDE.md's standing auto-merge
      # exception: merge once every check is green, no separate ask.
      # GitHub's own auto-merge does exactly that — waits for every
      # required status check (branch protection's contexts list, kept in
      # step with ci.yml's actual jobs) and squash-merges the moment
      # they're all green — so there's nothing to poll or gate here beyond
      # enabling it. Looked up by the label release-please applies itself
      # rather than the action's own pr output, whose shape has changed
      # across major versions before; a label survives that.
      - name: enable auto-merge on the release PR
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          pr=$(gh pr list --label "autorelease: pending" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr merge --auto --squash "$pr"
          fi

  goreleaser:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # goreleaser's dockers: block needs both: buildx to build the arm64
      # image cross-arch on this amd64 runner (via QEMU), and a registry
      # login it doesn't do itself.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # actions/attest-build-provenance's subject-path doesn't expand brace
      # patterns (dist/*.{tar.gz,deb,rpm} matched nothing at all, confirmed
      # live on the v2.2.0 release run) — one glob per line instead, which
      # is the documented way to give it more than one pattern.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
      # Attest the two per-arch images goreleaser just pushed. Their
      # digests aren't a goreleaser output, so pull them straight off the
      # registry manifest list docker_manifests just wrote.
      - id: digests
        run: |
          version=$(cat dist/metadata.json | jq -r .version)
          image="ghcr.io/${{ github.repository }}"
          echo "amd64=$(docker buildx imagetools inspect "$image:$version-amd64" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
          echo "arm64=$(docker buildx imagetools inspect "$image:$version-arm64" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.amd64 }}
          push-to-registry: true
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.digests.outputs.arm64 }}
          push-to-registry: true
