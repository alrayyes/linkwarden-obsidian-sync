# A real Linkwarden instance to test internal/linkwarden against — not
# this tool's own runtime, and not wired into CI (minting a usable access
# token means walking Linkwarden's NextAuth credentials+CSRF login flow,
# which doesn't reduce to a single API call; see CONTRIBUTING.md's
# "Testing against a real Linkwarden instance" section for the full
# recipe). Deliberately omits Meilisearch, unlike Linkwarden's own
# docker-compose.yml: this client never sends searchQueryString, so
# Linkwarden's /api/v1/search always takes its non-Meilisearch fallback
# path regardless, confirmed live against this exact compose file.
services:
  postgres:
    image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testpassword}
    restart: unless-stopped

  # Deliberately unpinned, unlike postgres above: the whole point of this
  # compose file is catching internal/linkwarden's fake drifting from
  # Linkwarden's actual API (see CONTRIBUTING.md), so it has to track what
  # Linkwarden currently ships, not a version frozen the day this was
  # written.
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:latest
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-testpassword}@postgres:5432/postgres
      NEXTAUTH_URL: http://localhost:3000/api/v1/auth
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-test-secret-not-for-production-use}
      NEXT_PUBLIC_DISABLE_REGISTRATION: "false"
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    restart: unless-stopped
